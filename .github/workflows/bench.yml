name: Bench
run-name: Bench on ${{ github.ref_name }}

# Wall-clock numbers are noisy on shared runners, so this is not part of the PR checks.
# It runs on demand and on release tags. Failing a release on it is opt-in.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: End-to-end benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Setup just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install hyperfine and strace
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine strace zsh

      - name: Run benchmarks
        run: just bench-check

      - name: Upload hyperfine results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bench-results
          path: target/bench/*
          if-no-files-found: warn
