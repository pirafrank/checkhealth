[package]
name = "checkhealth"
authors = ["Francesco Pira <dev@fpira.com>"]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/pirafrank/checkhealth"
documentation = "https://github.com/pirafrank/checkhealth/blob/main/README.md"
description = "A cross-platform utility to check your toolbelt for necessary tools."
license = "MIT"
readme = "README.md"
rust-version = "1.85.0"
build = "build.rs"
homepage = "https://fpira.com/projects"
#keywords = ["binary-manager", "portable-tools", "zero-config", "no-install", "userspace"]
#categories = ["command-line-utilities"]
exclude = [
    ".git",
    ".github",
    "hooks",
    ".idea",
    ".vscode",
    ".DS_Store",
    "*.iml",
    "*.swp",
    "*.swo",
    "*.tmp",
    "*.log",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
#dirs = "6.0"
#errno = "0.3"
#libc = "0.2"
log = "0.4.27"
env_logger = "0.11.8"
clap-verbosity-flag = "3.0.3"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
# YAML: serde_yaml (archived) and serde_yml (unmaintained, unsound) are excluded. Candidates checked
# on 2026-11-23: serde-saphyr (actively maintained, but MSRV 1.89 > our 1.85), serde_norway
# (last release 2024-12) and serde_yaml_ng (last release 2024-05, repository not archived, last push
# 2025-09, no RustSec advisory, MSRV 1.64, MIT). serde_yaml_ng is the only one that fits the
# MSRV; revisit when the MSRV is raised to 1.89 or later.
serde_yaml_ng = "0.10"
which = "8"
wait-timeout = "0.2"
anstream = "0.6"
anstyle = "1"

[dev-dependencies]
tempfile = "3"
#serial_test = "3"
predicates = "3.1.3"
assert_cmd = "2.0.17"
#serde_json = "1.0"
#temp-env = "0.3"
#mockito = "1.7"
clap_mangen = "0.3"

[build-dependencies]
build_cfg = "1.1.0"
jiff = { version = "0.2", default-features = false, features = ["std"] }

# glibc_version only builds on glibc hosts and is only needed there.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.build-dependencies]
glibc_version = "0.1.2"

