[package]
name = "checkhealth"
authors = ["Francesco Pira <dev@fpira.com>"]
version = "0.2.0-rc.1"
edition = "2024"
repository = "https://github.com/pirafrank/checkhealth"
documentation = "https://github.com/pirafrank/checkhealth/blob/main/README.md"
description = "Check your toolbelt, or your AI agent's sandbox, for necessary tools."
license = "MIT"
readme = "README.md"
rust-version = "1.85.0"
build = "build.rs"
homepage = "https://fpira.com/projects"
#keywords = ["binary-manager", "portable-tools", "zero-config", "no-install", "userspace"]
#categories = ["command-line-utilities"]
exclude = [
    ".git",
    ".github",
    "hooks",
    ".idea",
    ".vscode",
    ".DS_Store",
    "*.iml",
    "*.swp",
    "*.swo",
    "*.tmp",
    "*.log",
]

[features]
# Enables hidden failure triggers (such as CHECKHEALTH_TEST_PANIC) used only by tests.
test-hooks = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
#dirs = "6.0"
#errno = "0.3"
#libc = "0.2"
log = "0.4.27"
env_logger = "0.11.8"
clap-verbosity-flag = "3.0.3"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
# YAML: serde_yaml (archived) and serde_yml (unmaintained, unsound) are excluded. Candidates checked
# on 2026-11-23: serde-saphyr (actively maintained, but MSRV 1.89 > our 1.85), serde_yaml_ng
# (depends on unsafe-libyaml, RUSTSEC-2024-0449 unmaintained; last release 2024-05) and
# serde_norway (last release 2024-12, MSRV 1.71, MIT OR Apache-2.0, built on the maintained
# unsafe-libyaml-norway fork, no advisory). serde_norway is the only one that fits the MSRV and
# `just audit`; revisit when the MSRV is raised to 1.89 or later (serde-saphyr).
serde_norway = "0.9"
serde_json = "1"
which = "8"
wait-timeout = "0.2"
anstream = "0.6"
anstyle = "1"

[dev-dependencies]
which = "8"
tempfile = "3"
#serial_test = "3"
predicates = "3.1.3"
assert_cmd = "2.0.17"
#temp-env = "0.3"
#mockito = "1.7"
clap_mangen = "0.3"

# Killing a timed-out probe together with its process group needs `kill(2)`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
build_cfg = "1.1.0"
jiff = { version = "0.2", default-features = false, features = ["std"] }

# glibc_version only builds on glibc hosts and is only needed there.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.build-dependencies]
glibc_version = "0.1.2"


# Needs the hidden failure triggers, so it only runs with `--all-features` (as `just test` does).
[[test]]
name = "panic"
required-features = ["test-hooks"]
